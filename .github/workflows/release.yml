name: Release Workflow

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Requisito para SonarCloud

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # PASO DE SEGURIDAD (Quality Gate)
      - name: Ejecutar Tests y Quality Gate de SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=jdc99_mgcss-track-L2group5 -Dsonar.qualitygate.wait=true

      - name: Generar artefacto (.jar)
        # Añadimos skipTests porque el Quality Gate ya los acaba de ejecutar
        run: ./mvnw clean package -DskipTests

      - name: Construir Imagen Docker
        run: docker build -t mgcss-track-l2group5:${{ github.ref_name }} .

      - name: Publicar Release en GitHub y adjuntar artefacto
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: target/*.jar
          generate_release_notes: true